  <!-- 2. initSentry() function definition -->
  <script>
    function initSentry() {
      if (typeof SentryConfig !== 'undefined' && SentryConfig.enabled && typeof Sentry !== 'undefined') {
        Sentry.init({
          dsn: SentryConfig.dsn,
          environment: SentryConfig.environment,
          release: 'word-problem-workshop@1.0.0',
          tracesSampleRate: SentryConfig.tracesSampleRate,
          sampleRate: SentryConfig.sampleRate,
          maxBreadcrumbs: 50,
          ignoreErrors: [
            'ResizeObserver loop limit exceeded',
            'ResizeObserver loop completed with undelivered notifications',
            'Non-Error promise rejection captured',
            'Script error.',
            'Load failed',
            'Failed to fetch'
          ]
        });
      }
    }

    window.addEventListener('error', function(event) {
      if (typeof Sentry !== 'undefined') {
        Sentry.captureException(event.error || new Error(event.message), {
          tags: { errorType: 'unhandled', severity: 'critical' },
          contexts: { errorEvent: { message: event.message, filename: event.filename, lineno: event.lineno } }
        });
      }
    });

    window.addEventListener('unhandledrejection', function(event) {
      if (typeof Sentry !== 'undefined') {
        Sentry.captureException(event.reason || new Error('Unhandled promise rejection'), {
          tags: { errorType: 'unhandled-promise', severity: 'critical' }
        });
      }
    });
  </script>

  <style>
    /* === CSS Variables (PART-020) === */
    :root {
      --mathai-green: #219653;
      --mathai-light-green: #D9F8D9;
      --mathai-red: #E35757;
      --mathai-light-red: #FFD9D9;
      --mathai-blue: #2563eb;
      --mathai-light-blue: #EBF0FF;
      --mathai-orange: #F2994A;
      --mathai-light-orange: #FFF3E0;
      --mathai-purple: #7C3AED;
      --mathai-light-purple: #F3E8FF;

      --mathai-light-gray: #F2F2F2;

      --mathai-font-size-title: 24px;
      --mathai-font-size-body: 16px;
      --mathai-font-size-label: 14px;
      --mathai-font-size-small: 12px;
    }

    /* === Reset === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mathai-font-family);
      background: var(--mathai-light-gray);
      color: var(--mathai-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* === ScreenLayout v2 overrides === */
    .mathai-layout-root { max-width: 480px; margin: 0 auto; }
    .mathai-layout-playarea {
      flex-direction: column !important;
      align-items: center !important;
      padding: 8px 16px !important;
      overflow-y: auto !important;
    }
    .mathai-ts-screen.active { flex: 1; justify-content: flex-start; padding-top: 16px; }
    .mathai-ts-card { min-height: 50dvh; }

    /* === Game Block === */
    .game-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }

    /* === Expression Card === */
    .expression-card {
      width: 100%;
      max-width: 360px;
      background: var(--mathai-white);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .expression-label {
      font-size: var(--mathai-font-size-label);
      color: var(--mathai-gray);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .expression-display {
      font-size: clamp(20px, 5vw, 36px);
      font-weight: 800;
      color: var(--mathai-purple);
      background: var(--mathai-light-purple);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 2px;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .expression-hint-text {
      font-size: var(--mathai-font-size-small);
      color: var(--mathai-gray);
      font-style: italic;
      line-height: 1.4;
    }

    /* === Writing Area === */
    .writing-area {
      width: 100%;
      max-width: 360px;
      background: var(--mathai-white);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      animation: slideInUp 0.4s ease;
    }

    .input-label {
      font-size: var(--mathai-font-size-label);
      color: var(--mathai-gray);
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .word-problem-input {
      width: 100%;
      border: 2px solid var(--mathai-border-gray);
      border-radius: 12px;
      padding: 12px;
      font-size: var(--mathai-font-size-body);
      font-family: var(--mathai-font-family);
      color: var(--mathai-text-primary);
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .word-problem-input:focus {
      border-color: var(--mathai-purple);
    }

    .char-count {
      font-size: var(--mathai-font-size-small);
      color: var(--mathai-gray);
      text-align: right;
      margin-bottom: 12px;
    }

    /* === Inline Error === */
    .inline-error {
      font-size: var(--mathai-font-size-small);
      color: var(--mathai-red);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    /* === Buttons (PART-022) === */
    .game-btn {
      width: 100%;
      padding: 14px 32px;
      border: none;
      border-radius: 12px;
      font-size: var(--mathai-font-size-body);
      font-weight: 600;
      font-family: var(--mathai-font-family);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--mathai-green);
      color: var(--mathai-white);
    }
    .btn-primary:hover { filter: brightness(0.9); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background: var(--mathai-light-gray);
      color: var(--mathai-text-primary);
    }
    .btn-secondary:hover { filter: brightness(0.95); }

    .feedback-next-btn {
      margin-top: 16px;
      animation: slideInUp 0.3s ease;
    }

    .evaluation-badge {
      width: 100%;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: var(--mathai-font-size-body);
      font-weight: 700;
      margin-bottom: 16px;
      animation: slideInUp 0.3s ease;
    }

    .evaluation-badge.correct-match {
      background: var(--mathai-light-green);
      border-left: 4px solid var(--mathai-green);
      color: var(--mathai-green);
    }
    .evaluation-badge.partial-match {
      background: var(--mathai-light-orange);
      border-left: 4px solid var(--mathai-orange);
      color: var(--mathai-orange);
    }
    .evaluation-badge.no-match {
      background: var(--mathai-light-red);
      border-left: 4px solid var(--mathai-red);
      color: var(--mathai-red);
    }

    .feedback-area {
      width: 100%;
      max-width: 360px;
      background: var(--mathai-white);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      animation: slideInUp 0.4s ease;
    }

    .feedback-section {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--mathai-light-gray);
    }
    .feedback-section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .feedback-label {
      font-size: var(--mathai-font-size-small);
      color: var(--mathai-gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .feedback-value {
      font-size: var(--mathai-font-size-body);
      font-weight: 700;
      color: var(--mathai-purple);
    }

    .feedback-user-problem {
      font-size: var(--mathai-font-size-body);
      color: var(--mathai-text-primary);
      line-height: 1.5;
      font-style: italic;
    }

    .feedback-reasoning {
      font-size: var(--mathai-font-size-body);
      color: var(--mathai-text-primary);
      line-height: 1.5;
    }

    .feedback-points {
      font-size: var(--mathai-font-size-title);
      font-weight: 700;
      color: var(--mathai-green);
    }

    .feedback-hint {
      background: var(--mathai-light-blue);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    .hint-label {
      font-size: var(--mathai-font-size-label);
      font-weight: 700;
      color: var(--mathai-blue);
      margin-bottom: 4px;
    }

    .hint-text {
      font-size: var(--mathai-font-size-label);
      color: var(--mathai-text-primary);
      line-height: 1.4;
    }

    .feedback-example {
      background: var(--mathai-light-purple);
      border-radius: 12px;
      padding: 12px;
      margin-top: 8px;
    }

    .example-label {
      font-size: var(--mathai-font-size-label);
      font-weight: 700;
      color: var(--mathai-purple);
      margin-bottom: 4px;
    }

    .example-text {
      font-size: var(--mathai-font-size-label);
      color: var(--mathai-text-primary);
      line-height: 1.4;
      font-style: italic;
    }

    /* === Button Spinner === */
    .btn-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    .btn-primary:disabled .btn-spinner { display: inline-block; }

    /* === Loading Indicator === */
    .loading-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      color: var(--mathai-gray);
      font-size: var(--mathai-font-size-label);
      width: 100%;
      max-width: 360px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid var(--mathai-light-gray);
      border-top-color: var(--mathai-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* === Button Container === */
    .btn-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      margin: 4px auto 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* === Animations === */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* === Results metrics (inline in TransitionScreen content) === */
    .results-metrics {
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .results-stars {
      text-align: center;
      font-size: 40px;
      margin-bottom: 16px;
      animation: fadeIn 0.6s ease;
    }
    .results-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--mathai-border-gray);
      font-size: var(--mathai-font-size-body);
    }
    .results-row:last-child { border-bottom: none; }
    .results-row-label { color: var(--mathai-gray); }
    .results-row-value { font-weight: 700; color: var(--mathai-text-primary); }
    .results-row-value.highlight { color: var(--mathai-green); font-size: 18px; }
  </style>
</head>

    // === Utility Functions ===

    function trackEvent(name, category, data) {
      var evt = { name: name, category: category || 'game', data: data || {}, timestamp: Date.now() };
      gameState.events.push(evt);
      console.log('[Event]', name, data || '');
    }

    function recordAttempt(attemptData) {
      var attempt = {
        timestamp: Date.now(),
        round: gameState.currentRound + 1,
        input_of_user: attemptData.input_of_user,
        correct: attemptData.correct,
        metadata: attemptData.metadata || {}
      };
      gameState.attempts.push(attempt);
    }

    function computeTriesPerRound(attempts) {
      var rounds = {};
      attempts.forEach(function(a) {
        var r = (a.metadata && a.metadata.round) ? a.metadata.round : 0;
        rounds[r] = (rounds[r] || 0) + 1;
      });
      return Object.keys(rounds).map(function(r) {
        return { round: Number(r), triesCount: rounds[r] };
      });
    }

    function formatTime(seconds) {
      var m = Math.floor(seconds / 60);
      var s = seconds % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function canPlayAudio() {
      return typeof FeedbackManager !== 'undefined' && FeedbackManager && typeof FeedbackManager.playDynamicFeedback === 'function';
    }

    function createProgressBar() {
      if (progressBar) { progressBar.destroy(); progressBar = null; }
      progressBar = new ProgressBarComponent({
        autoInject: true,
        totalRounds: gameState.totalRounds || 10,
        totalLives: 0,
        slotId: 'mathai-progress-slot'
      });
    }

    function updateQuestionText(roundData) {
      var stageNames = { 1: 'Simple Operations', 2: 'Multi-Step', 3: 'Mixed Operations' };
      var el = document.getElementById(questionSlotId);
      if (el) {
        el.innerHTML = '<div style="text-align:center;padding:4px 0;">'
          + '<div style="font-size:14px;color:var(--mathai-gray);">Round ' + roundData.roundNumber + ' \u2014 Stage ' + roundData.stage + ': ' + stageNames[roundData.stage] + '</div>'
          + '<div style="font-size:12px;color:var(--mathai-gray);margin-top:2px;">Write a word problem for the expression below</div>'
          + '</div>';
      }
    }

    // === waitForPackages (PART-003) ===
    function waitForPackages() {
      return new Promise(function(resolve, reject) {
        var requiredPackages = ['ScreenLayout', 'ProgressBarComponent', 'TransitionScreenComponent', 'FeedbackManager', 'VisibilityTracker', 'SignalCollector', 'MathAIHelpers'];
        var timeout = 10000;
        var startTime = Date.now();

        function check() {
          var allLoaded = requiredPackages.every(function(pkg) {
            return typeof window[pkg] !== 'undefined';
          });
          if (allLoaded) {
            resolve();
          } else if (Date.now() - startTime > timeout) {
            var missing = requiredPackages.filter(function(pkg) { return typeof window[pkg] === 'undefined'; });
            console.warn('Packages not loaded after timeout:', missing.join(', '));
            resolve();
          } else {
            setTimeout(check, 100);
          }
        }
        check();
      });
    }

    // === LLM Evaluation (PART-015 — PRIMARY) ===
    async function validateWordProblemLLM(wordProblem, expression, expressionDisplay, expectedResult, rubric) {
      try {
        var sanitizedProblem = wordProblem.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ');

        var result = await MathAIHelpers.SubjectiveEvaluation.evaluate({
          components: [{
            component_id: 'wp_' + gameState.currentRound,
            evaluation_prompt: 'Math expression: "' + expressionDisplay + '" (result = ' + expectedResult + ')\n'
              + 'Student\'s word problem: "' + sanitizedProblem + '"\n'
              + 'Rubric: ' + rubric + '\n\n'
              + 'Evaluate whether the student\'s word problem correctly represents the given math expression.\n\n'
              + 'Be GENEROUS and BROAD in your evaluation \u2014 this is a Grade 4 student being creative. Accept any word problem that demonstrates understanding of the math, even if:\n'
              + '- The items are different types\n'
              + '- The wording is informal, uses slang, or has minor grammar/spelling mistakes\n'
              + '- The story is silly, fantastical, or uses unusual scenarios\n'
              + '- The student describes the result explicitly rather than posing it as a question\n\n'
              + 'IMPORTANT: Profanity, insults, abuse, and offensive language are NEVER correct. They are ALWAYS no_match.\n'
              + 'The word "idk" or "I don\'t know" as a standalone answer means the student doesn\'t know \u2014 classify as no_match.\n\n'
              + 'What matters is:\n'
              + '1. The correct quantities from the expression appear in the story\n'
              + '2. The relationship between quantities matches the operation\n'
              + '3. The math works out to the correct result\n\n'
              + 'Return ONLY one of these three words \u2014 nothing else, no quotes, no explanation:\n'
              + 'correct_match\npartial_match\nno_match',
            feedback_prompt: 'You are a friendly math tutor helping a Grade 4 student learn to write word problems.\n\n'
              + 'Math expression: "' + expressionDisplay + '"\n'
              + 'Student\'s word problem: "' + sanitizedProblem + '"\n'
              + 'Evaluation: {{evaluation}}\n\n'
              + 'Provide a short (2-3 sentence) encouraging feedback.\n'
              + 'Keep it warm and age-appropriate for a Grade 4 student. Use simple language.'
          }],
          timeout: 30000
        });

        if (!result || !result.data || !result.data[0]) {
          console.error('Subjective evaluation returned malformed response:', JSON.stringify(result, null, 2));
          return { tier: 'no_match', evaluation: '', feedback: 'We couldn\'t evaluate your word problem this time. Keep trying!' };
        }

        var componentResult = result.data[0];
        var evalText = (componentResult.evaluation || '').trim().toLowerCase().replace(/[^a-z_]/g, '');

        var tier = 'no_match';
        if (evalText.indexOf('correct_match') !== -1) tier = 'correct_match';
        else if (evalText.indexOf('partial_match') !== -1) tier = 'partial_match';

        return {
          tier: tier,
          evaluation: componentResult.evaluation || '',
          feedback: componentResult.feedback || ''
        };
      } catch (error) {
        console.error('LLM validation error:', JSON.stringify({ error: error.message }, null, 2));
        if (typeof Sentry !== 'undefined') {
          Sentry.captureException(error, { tags: { phase: 'llm-evaluation', component: 'SubjectiveEvaluation', severity: 'high' } });
        }
        return { tier: 'no_match', evaluation: '', feedback: 'We couldn\'t evaluate your word problem this time. Keep trying!' };
      }
    }

    // === Show Feedback UI ===
    function showFeedbackUI(roundData, result, roundPoints, wordProblem) {
      var badge = document.getElementById('evaluation-badge');
      var tierClass = result.tier.replace(/_/g, '-');
      badge.className = 'evaluation-badge ' + tierClass;

      var badgeLabels = {
        'correct_match': '\u2705 Great Match!',
        'partial_match': '\uD83D\uDD36 Partial Match',
        'no_match': '\u274C Not Quite'
      };
      badge.textContent = badgeLabels[result.tier] || '\u274C Not Quite';

      document.getElementById('feedback-expression').textContent = roundData.expressionDisplay;
      document.getElementById('feedback-user-problem').textContent = wordProblem;
      document.getElementById('feedback-reasoning').textContent = result.feedback || 'No feedback available.';
      document.getElementById('feedback-points').textContent = roundPoints + ' / 3';

      // Show hint and example for non-correct
      var hintEl = document.getElementById('feedback-hint');
      var exampleEl = document.getElementById('feedback-example');
      if (result.tier !== 'correct_match') {
        document.getElementById('hint-text').textContent = roundData.hints.thinkAbout;
        hintEl.style.display = 'block';
        document.getElementById('example-text').textContent = roundData.exampleWordProblem;
        exampleEl.style.display = 'block';
      } else {
        hintEl.style.display = 'none';
        exampleEl.style.display = 'none';
      }

      // Hide writing UI, show feedback
      document.getElementById('expression-card').style.display = 'none';
      document.getElementById('writing-area').style.display = 'none';
      document.getElementById('loading-indicator').style.display = 'none';
      document.getElementById('feedback-area').style.display = 'block';

      // Hide reset button during feedback
      document.getElementById('btn-reset').style.display = 'none';

      // Repurpose submit button to "Next Round" / "See Results"
      var btnSubmit = document.getElementById('btn-submit-problem');
      var btnText = document.getElementById('btn-submit-text');
      var isLastRound = (gameState.currentRound >= gameState.totalRounds - 1);
      btnText.textContent = isLastRound ? 'See Results' : 'Next Round';
      btnSubmit.disabled = false;
      btnSubmit.onclick = handleNextRound;
    }

    // === Setup Game ===
    function setupGame() {
      if (!gameState.content) {
        gameState.content = fallbackContent;
      }
    }

    // === Setup Round ===
    function setupRound() {
      var roundData = gameState.content.rounds[gameState.currentRound];
      gameState.roundData = roundData;
      gameState.currentStage = roundData.stage;
      gameState.wordProblemText = '';
      gameState.evaluationResult = null;
      gameState.feedbackText = '';
      gameState.isProcessing = false;
      gameState.phase = 'writing';

      // Populate expression card
      document.getElementById('expression-display').textContent = roundData.expressionDisplay;
      var stageHints = {
        1: 'Think of a real-life situation with this operation.',
        2: 'This has two steps \u2014 your story needs two parts!',
        3: 'This combines multiple operations \u2014 build a story with different actions!'
      };
      document.getElementById('expression-hint-text').textContent = stageHints[roundData.stage] || '';

      // Clear input
      var inputEl = document.getElementById('word-problem-input');
      inputEl.value = '';
      inputEl.disabled = false;
      document.getElementById('char-count').textContent = '0';

      // Show/hide elements
      document.getElementById('expression-card').style.display = 'block';
      document.getElementById('writing-area').style.display = 'block';
      document.getElementById('feedback-area').style.display = 'none';
      document.getElementById('feedback-hint').style.display = 'none';
      document.getElementById('feedback-example').style.display = 'none';
      document.getElementById('writing-error').style.display = 'none';
      document.getElementById('loading-indicator').style.display = 'none';
      document.getElementById('btn-container').style.display = 'flex';

      // Show reset button again
      document.getElementById('btn-reset').style.display = 'block';

      // Restore submit button
      var btnSubmit = document.getElementById('btn-submit-problem');
      btnSubmit.disabled = false;
      btnSubmit.onclick = handleProblemSubmit;
      document.getElementById('btn-submit-text').textContent = 'Submit Word Problem';

      // Update progress
      if (progressBar) {
        progressBar.update(gameState.currentRound, 0);
      }

      // Update question text
      updateQuestionText(roundData);

      // Focus textarea
      setTimeout(function() {
        inputEl.focus();
      }, 300);

      trackEvent('round_start', 'game', { round: gameState.currentRound + 1, stage: roundData.stage, expression: roundData.expression });

      if (signalCollector) {
        signalCollector.recordViewEvent('content_render', {
          screen: 'gameplay',
          content_snapshot: {
            expression: roundData.expressionDisplay,
            round: gameState.currentRound + 1,
            stage: roundData.stage,
            operation: roundData.operation,
            trigger: 'round_start'
          },
          components: {
            progress: { current: gameState.currentRound, total: gameState.totalRounds }
          }
        });
      }
    }

    // === Handle Problem Submit ===
    async function handleProblemSubmit() {
      if (!gameState.isActive || gameState.isProcessing) return;
      gameState.isProcessing = true;
      gameState.phase = 'evaluating';

      var wordProblem = document.getElementById('word-problem-input').value.trim();

      if (wordProblem.length < 10) {
        document.getElementById('writing-error').textContent = 'Please write at least a sentence describing a real-world situation.';
        document.getElementById('writing-error').style.display = 'block';
        gameState.isProcessing = false;
        gameState.phase = 'writing';
        return;
      }

      document.getElementById('writing-error').style.display = 'none';
      gameState.wordProblemText = wordProblem;

      trackEvent('word_problem_submit', 'game', { wordProblem: wordProblem, round: gameState.currentRound + 1, expression: gameState.roundData.expression });

      // Disable submit, show spinner
      var btnSubmit = document.getElementById('btn-submit-problem');
      btnSubmit.disabled = true;
      document.getElementById('btn-submit-text').textContent = 'Evaluating...';

      // Disable textarea
      document.getElementById('word-problem-input').disabled = true;

      // Show loading
      document.getElementById('loading-indicator').style.display = 'flex';

      var roundData = gameState.roundData;

      try {
        var result = await validateWordProblemLLM(
          wordProblem,
          roundData.expression,
          roundData.expressionDisplay,
          roundData.result,
          roundData.rubric
        );

        gameState.evaluationResult = result.tier;
        gameState.feedbackText = result.feedback;

        var roundPoints = 0;
        if (gameState.evaluationResult === 'correct_match') roundPoints = 3;
        else if (gameState.evaluationResult === 'partial_match') roundPoints = 1;
        gameState.totalPoints += roundPoints;
        if (gameState.evaluationResult === 'correct_match') gameState.correctCount++;
        if (gameState.evaluationResult === 'partial_match') gameState.partialCount++;

        trackEvent('evaluation_complete', 'game', { wordProblem: wordProblem, tier: gameState.evaluationResult, feedback: result.feedback, roundPoints: roundPoints, round: gameState.currentRound + 1 });

        gameState.phase = 'feedback';

        // Show feedback UI
        showFeedbackUI(roundData, result, roundPoints, wordProblem);

        // Play SFX + sticker (fire-and-forget)
        var isCorrect = gameState.evaluationResult === 'correct_match';
        if (isCorrect) {
          FeedbackManager.sound.play('correct_sound_effect', {
            sticker: { image: CORRECT_STICKER_URL, duration: 2, type: 'IMAGE_GIF' }
          }).catch(function(e) { console.error('Audio error:', JSON.stringify({ error: e.message }, null, 2)); });
        } else {
          FeedbackManager.sound.play('incorrect_sound_effect', {
            sticker: { image: INCORRECT_STICKER_URL, duration: 2, type: 'IMAGE_GIF' }
          }).catch(function(e) { console.error('Audio error:', JSON.stringify({ error: e.message }, null, 2)); });
        }

        // Play dynamic TTS with feedback — AWAITED
        var feedbackText = result.feedback || roundData.hints.revealExplanation;
        document.getElementById('btn-submit-text').textContent = 'Playing Feedback...';
        gameState.currentDynamicAudio = FeedbackManager.playDynamicFeedback({
          audio_content: feedbackText,
          subtitle: feedbackText,
          sticker: isCorrect ? CORRECT_STICKER_URL : INCORRECT_STICKER_URL
        });
        await gameState.currentDynamicAudio;
        gameState.currentDynamicAudio = null;

        // Record view event
        if (signalCollector) {
          signalCollector.recordViewEvent('feedback_display', {
            screen: 'gameplay',
            content_snapshot: {
              feedback_type: gameState.evaluationResult,
              round_points: roundPoints,
              round: gameState.currentRound + 1,
              trigger: 'user_action'
            }
          });
        }

        // Record attempt
        recordAttempt({
          input_of_user: { wordProblem: gameState.wordProblemText },
          correct: gameState.evaluationResult === 'correct_match',
          metadata: {
            round: gameState.currentRound + 1,
            expression: gameState.roundData.expressionDisplay,
            result: gameState.roundData.result,
            evaluationTier: gameState.evaluationResult,
            roundPoints: roundPoints,
            validationType: 'subjective',
            llmFeedback: result.feedback
          }
        });

        // Record round outcome
        if (signalCollector) {
          signalCollector.recordCustomEvent('round_solved', {
            correct: gameState.evaluationResult === 'correct_match',
            round: gameState.currentRound + 1,
            evaluationTier: gameState.evaluationResult,
            roundPoints: roundPoints
          });
        }

        // Update button text after audio finishes
        var isLastRound = (gameState.currentRound >= gameState.totalRounds - 1);
        document.getElementById('btn-submit-text').textContent = isLastRound ? 'See Results' : 'Next Round';
        btnSubmit.disabled = false;

      } catch (error) {
        console.error('Word problem evaluation failed:', JSON.stringify({ error: error.message }, null, 2));
        if (typeof Sentry !== 'undefined') {
          Sentry.captureException(error, { tags: { phase: 'word-problem-evaluation', severity: 'high' } });
        }

        document.getElementById('loading-indicator').style.display = 'none';
        showFeedbackUI(roundData, { tier: 'no_match', feedback: 'We couldn\'t evaluate your word problem this time. Your answer was saved!' }, 0, wordProblem);

        recordAttempt({
          input_of_user: { wordProblem: wordProblem },
          correct: false,
          metadata: {
            round: gameState.currentRound + 1,
            expression: roundData.expressionDisplay,
            result: roundData.result,
            evaluationTier: 'no_match',
            roundPoints: 0,
            validationType: 'subjective',
            error: error.message
          }
        });

        var isLastRound = (gameState.currentRound >= gameState.totalRounds - 1);
        document.getElementById('btn-submit-text').textContent = isLastRound ? 'See Results' : 'Next Round';
        btnSubmit.disabled = false;
        btnSubmit.onclick = handleNextRound;
      }

      gameState.isProcessing = false;
    }

    // === Handle Next Round ===
    function handleNextRound() {
      FeedbackManager._stopCurrentDynamic();

      var btnSubmit = document.getElementById('btn-submit-problem');
      btnSubmit.onclick = handleProblemSubmit;

      trackEvent('round_complete', 'game', { round: gameState.currentRound + 1 });

      gameState.currentRound++;
      if (progressBar) {
        progressBar.update(gameState.currentRound, 0);
      }

      if (gameState.currentRound >= gameState.totalRounds) {
        endGame();
      } else {
        showRoundTransition();
      }
    }

    // === Handle Reset ===
    function handleReset() {
      if (gameState.isProcessing) return;
      if (gameState.evaluationResult !== null) return;

      FeedbackManager._stopCurrentDynamic();

      var inputEl = document.getElementById('word-problem-input');
      inputEl.value = '';
      inputEl.disabled = false;
      document.getElementById('char-count').textContent = '0';
      document.getElementById('writing-error').style.display = 'none';
      document.getElementById('loading-indicator').style.display = 'none';
      document.getElementById('feedback-area').style.display = 'none';
      document.getElementById('expression-card').style.display = 'block';
      document.getElementById('writing-area').style.display = 'block';

      var btnSubmit = document.getElementById('btn-submit-problem');
      btnSubmit.onclick = handleProblemSubmit;
      btnSubmit.disabled = false;
      document.getElementById('btn-submit-text').textContent = 'Submit Word Problem';

      gameState.wordProblemText = '';

      trackEvent('answer_reset', 'game', { round: gameState.currentRound + 1 });
    }

    // === Show Round Transition ===
    function showRoundTransition() {
      FeedbackManager._stopCurrentDynamic();

      var roundIndex = gameState.currentRound;
      var roundData = gameState.content.rounds[roundIndex];
      var roundNum = roundData.roundNumber;

      // Check if stage changed
      if (roundIndex > 0) {
        var prevRound = gameState.content.rounds[roundIndex - 1];
        if (prevRound && prevRound.stage !== roundData.stage) {
          showStageTransition(roundData);
          return;
        }
      }

      transitionScreen.show({
        icons: ['\u270F\uFE0F'],
        iconSize: 'normal',
        title: 'Round ' + roundNum,
        subtitle: 'Write a word problem for: ' + roundData.expressionDisplay,
        persist: true,
        buttons: [{ text: "Let's Go!", type: 'primary', action: function() {
          FeedbackManager._stopCurrentDynamic();
          transitionScreen.hide();
          setupRound();
        }}]
      });

      // Play round VO
      var stickerIndex = roundIndex % ROUND_STICKERS.length;
      try {
        gameState.currentDynamicAudio = FeedbackManager.playDynamicFeedback({
          audio_content: 'Round ' + roundNum + '! Write a word problem for ' + roundData.expressionDisplay + '.',
          subtitle: 'Round ' + roundNum + ': ' + roundData.expressionDisplay,
          sticker: ROUND_STICKERS[stickerIndex]
        });
      } catch(e) { console.error('Round VO error:', JSON.stringify({ error: e.message }, null, 2)); }
    }

    // === Show Stage Transition ===
    function showStageTransition(roundData) {
      FeedbackManager._stopCurrentDynamic();

      var stageNames = { 1: 'Simple Operations', 2: 'Multi-Step', 3: 'Mixed Operations' };
      var stageDescs = { 1: 'One operation \u2014 build a simple story!', 2: 'Two steps \u2014 your story needs two parts!', 3: 'Multiple operations \u2014 create a complex story!' };

      transitionScreen.show({
        icons: ['\u270F\uFE0F'],
        iconSize: 'large',
        title: 'Stage ' + roundData.stage + ': ' + stageNames[roundData.stage],
        subtitle: stageDescs[roundData.stage],
        persist: true,
        buttons: [{ text: "I'm Ready!", type: 'primary', action: function() {
          FeedbackManager._stopCurrentDynamic();
          transitionScreen.hide();
          setupRound();
        }}]
      });

      var stickerIndex = gameState.currentRound % ROUND_STICKERS.length;
      try {
        gameState.currentDynamicAudio = FeedbackManager.playDynamicFeedback({
          audio_content: 'Stage ' + roundData.stage + ': ' + stageNames[roundData.stage] + '! ' + stageDescs[roundData.stage],
          subtitle: stageNames[roundData.stage],
          sticker: ROUND_STICKERS[stickerIndex]
        });
      } catch(e) { console.error('Stage VO error:', JSON.stringify({ error: e.message }, null, 2)); }
    }

    // === Start Game ===
    function startGame() {
      FeedbackManager._stopCurrentDynamic();
      transitionScreen.hide();
      setupGame();

      gameState.currentRound = 0;
      gameState.startTime = Date.now();
      gameState.duration_data.startTime = new Date().toISOString();
      gameState.isActive = true;
      gameState.gameEnded = false;

      trackEvent('game_start', 'game');

      showRoundTransition();
    }

    // === End Game ===
    async function endGame() {
      if (gameState.gameEnded) return;
      gameState.gameEnded = true;
      gameState.isActive = false;
      gameState.phase = 'results';
      gameState.duration_data.currentTime = new Date().toISOString();

      var timeTaken = Math.round((Date.now() - gameState.startTime) / 1000);
      var accuracy = gameState.totalRounds > 0 ? Math.round((gameState.correctCount / gameState.totalRounds) * 100) : 0;
      var stars = 1;
      if (gameState.totalPoints >= 24) stars = 3;
      else if (gameState.totalPoints >= 15) stars = 2;

      var metrics = {
        accuracy: accuracy,
        time: timeTaken,
        stars: stars,
        attempts: gameState.attempts,
        duration_data: gameState.duration_data,
        totalLives: 1,
        tries: computeTriesPerRound(gameState.attempts),
        totalPoints: gameState.totalPoints,
        correctCount: gameState.correctCount,
        partialCount: gameState.partialCount,
        totalRounds: gameState.totalRounds
      };

      if (gameState.sessionHistory && gameState.sessionHistory.length > 0) {
        metrics.sessionHistory = gameState.sessionHistory.concat([{
          totalLives: 1,
          tries: computeTriesPerRound(gameState.attempts)
        }]);
      }

      trackEvent('game_end', 'game', { metrics: { stars: stars, accuracy: accuracy, totalPoints: gameState.totalPoints } });

      if (typeof Sentry !== 'undefined') {
        Sentry.addBreadcrumb({ category: 'game', message: 'endGame', data: { stars: stars, accuracy: accuracy, totalPoints: gameState.totalPoints }, level: 'info' });
      }

      // Signal collector — record view BEFORE seal
      if (signalCollector) {
        signalCollector.recordViewEvent('screen_transition', {
          screen: 'results',
          metadata: { transition_from: 'gameplay' }
        });
        var sealResult = signalCollector.seal();
        if (sealResult) {
          metrics.signal_event_count = sealResult.event_count || 0;
          metrics.signal_metadata = sealResult.metadata || {};
        }
      }

      // Show results
      showResults(metrics, stars);

      // PostMessage BEFORE audio
      window.parent.postMessage({
        type: 'game_complete',
        data: {
          metrics: metrics,
          attempts: gameState.attempts,
          completedAt: Date.now(),
          signal_event_count: metrics.signal_event_count || 0,
          signal_metadata: metrics.signal_metadata || {}
        }
      }, '*');

      // Play end-game audio
      if (stars === 3) {
        try { await FeedbackManager.sound.play('victory_sound_effect', { sticker: { image: VICTORY_STICKER_URL, duration: 3, type: 'IMAGE_GIF' } }); } catch(e) {}
        try { await FeedbackManager.sound.play('victory'); } catch(e) {}
      } else if (stars === 2) {
        try { await FeedbackManager.sound.play('game_complete_sound_effect', { sticker: { image: GAME_COMPLETE_STICKER_URL, duration: 3, type: 'IMAGE_GIF' } }); } catch(e) {}
        try { await FeedbackManager.sound.play('game_complete_2_star'); } catch(e) {}
      } else {
        try { await FeedbackManager.sound.play('game_complete_sound_effect', { sticker: { image: GAME_COMPLETE_STICKER_URL, duration: 3, type: 'IMAGE_GIF' } }); } catch(e) {}
        try { await FeedbackManager.sound.play('game_complete_1_star'); } catch(e) {}
      }

      // Guarded cleanup
      if (gameState.gameEnded) {
        if (visibilityTracker) { visibilityTracker.destroy(); visibilityTracker = null; }
        try { FeedbackManager._stopCurrentDynamic(); } catch(e) {}
        if (progressBar) { progressBar.destroy(); progressBar = null; }
      }
    }

    // === Show Results ===
    function showResults(metrics, stars) {
      var starsHTML = '';
      for (var i = 0; i < 3; i++) {
        starsHTML += (i < stars) ? '\u2B50' : '\u2606';
      }

      var metricsHTML = '<div class="results-metrics">'
        + '<div class="results-stars">' + starsHTML + '</div>'
        + '<div class="results-row"><span class="results-row-label">Total Points</span><span class="results-row-value highlight">' + metrics.totalPoints + ' / 30</span></div>'
        + '<div class="results-row"><span class="results-row-label">Perfect Matches</span><span class="results-row-value">' + metrics.correctCount + ' / ' + metrics.totalRounds + '</span></div>'
        + '<div class="results-row"><span class="results-row-label">Partial Matches</span><span class="results-row-value">' + metrics.partialCount + ' / ' + metrics.totalRounds + '</span></div>'
        + '<div class="results-row"><span class="results-row-label">Time</span><span class="results-row-value">' + formatTime(metrics.time) + '</span></div>'
        + '</div>';

      var buttonText = stars >= 3 ? 'Play Again' : 'Retry for more stars';

      transitionScreen.show({
        title: stars >= 3 ? 'Excellent!' : (stars >= 2 ? 'Good Try!' : 'Keep Practicing!'),
        content: metricsHTML,
        persist: true,
        buttons: [{ text: buttonText, type: stars >= 3 ? 'primary' : 'secondary',
          action: function() { FeedbackManager._stopCurrentDynamic(); restartGame(); } }]
      });
    }

    // === Restart Game ===
    function restartGame() {
      // Push session snapshot BEFORE resetting
      if (!gameState.sessionHistory) gameState.sessionHistory = [];
      gameState.sessionHistory.push({
        totalLives: 1,
        totalPoints: gameState.totalPoints,
        tries: computeTriesPerRound(gameState.attempts)
      });

      // Preserve across restart
      var preserved = {
        content: gameState.content,
        contentSetId: gameState.contentSetId,
        signalConfig: gameState.signalConfig,
        sessionHistory: gameState.sessionHistory,
        voGameStartPlayed: gameState.voGameStartPlayed
      };

      // Reset all gameState fields
      gameState.currentRound = 0;
      gameState.score = 0;
      gameState.attempts = [];
      gameState.events = [];
      gameState.startTime = null;
      gameState.isActive = false;
      gameState.isProcessing = false;
      gameState.gameEnded = false;
      gameState.phase = 'start';
      gameState.currentStage = 1;
      gameState.totalPoints = 0;
      gameState.wordProblemText = '';
      gameState.evaluationResult = null;
      gameState.feedbackText = '';
      gameState.roundData = null;
      gameState.correctCount = 0;
      gameState.partialCount = 0;
      gameState.currentDynamicAudio = null;
      gameState.duration_data = {
        startTime: null,
        preview: [],
        attempts: [],
        evaluations: [],
        inActiveTime: [],
        totalInactiveTime: 0,
        currentTime: null
      };

      // Restore preserved
      gameState.content = preserved.content;
      gameState.contentSetId = preserved.contentSetId;
      gameState.signalConfig = preserved.signalConfig;
      gameState.sessionHistory = preserved.sessionHistory;
      gameState.voGameStartPlayed = preserved.voGameStartPlayed;

      // Recreate SignalCollector
      if (typeof SignalCollector !== 'undefined') {
        signalCollector = new SignalCollector({
          sessionId: (window.gameVariableState && window.gameVariableState.sessionId) ? window.gameVariableState.sessionId : 'session_' + Date.now(),
          studentId: (window.gameVariableState && window.gameVariableState.studentId) ? window.gameVariableState.studentId : null,
          gameId: gameState.gameId,
          contentSetId: gameState.contentSetId
        });
        window.signalCollector = signalCollector;
        if (gameState.signalConfig && gameState.signalConfig.flushUrl) {
          signalCollector.flushUrl = gameState.signalConfig.flushUrl;
          signalCollector.playId = gameState.signalConfig.playId || null;
          signalCollector.sessionId = gameState.signalConfig.sessionId || signalCollector.sessionId;
          signalCollector.studentId = gameState.signalConfig.studentId || signalCollector.studentId;
          signalCollector.startFlushing();
        }
      }

      // Recreate VisibilityTracker
      if (visibilityTrackerConfig && typeof VisibilityTracker !== 'undefined') {
        visibilityTracker = new VisibilityTracker(visibilityTrackerConfig);
      }

      // Recreate ProgressBar
      createProgressBar();
      if (progressBar) progressBar.update(0, 0);

      // Restore question text
      var qtEl = document.getElementById(questionSlotId);
      if (qtEl) {
        qtEl.innerHTML = '<div style="text-align:center;padding:4px 0;">'
          + '<div style="font-weight:700;font-size:16px;color:var(--mathai-text-primary);">Word Problem Workshop</div>'
          + '<div style="font-size:12px;color:var(--mathai-gray);margin-top:2px;">Turn math expressions into real-world stories!</div>'
          + '</div>';
      }

      // Re-enable writing area
      var inputEl = document.getElementById('word-problem-input');
      if (inputEl) {
        inputEl.disabled = false;
        inputEl.value = '';
      }

      // Restore submit button
      var btnSubmit = document.getElementById('btn-submit-problem');
      if (btnSubmit) {
        btnSubmit.onclick = handleProblemSubmit;
        btnSubmit.disabled = false;
      }

      // Show start transition screen (no duplicate game_start event)
      transitionScreen.show({
        icons: ['\u270F\uFE0F'],
        iconSize: 'large',
        title: 'Word Problem Workshop',
        subtitle: 'Turn math expressions into real-world stories!',
        persist: true,
        buttons: [{ text: "Let's Go!", type: 'primary', action: function() { FeedbackManager._stopCurrentDynamic(); startGame(); } }]
      });
    }

    // === PostMessage Handler ===
    function handlePostMessage(event) {
      if (event.data && event.data.type === 'game_init') {
        gameState.content = (event.data.data && event.data.data.content) ? event.data.data.content : fallbackContent;
        gameState.contentSetId = (event.data.data && event.data.data.contentSetId) ? event.data.data.contentSetId : null;
        gameState.signalConfig = (event.data.data && event.data.data.signalConfig) ? event.data.data.signalConfig : null;

        // Configure SignalCollector flush
        if (signalCollector && gameState.signalConfig) {
          if (gameState.signalConfig.flushUrl) signalCollector.flushUrl = gameState.signalConfig.flushUrl;
          if (gameState.signalConfig.playId) signalCollector.playId = gameState.signalConfig.playId;
          if (gameState.signalConfig.sessionId) signalCollector.sessionId = gameState.signalConfig.sessionId;
          if (gameState.signalConfig.studentId) signalCollector.studentId = gameState.signalConfig.studentId;
          signalCollector.gameId = gameState.gameId;
          signalCollector.contentSetId = gameState.contentSetId;
          signalCollector.startFlushing();
        }

        if (signalCollector) {
          signalCollector.recordViewEvent('screen_transition', {
            screen: 'start',
            metadata: { transition_from: 'loading', content_loaded: true }
          });
        }
      }
    }

    // === Debug Functions (PART-012) ===
    window.debugGame = function() {
      console.log('=== Game State ===');
      console.log(JSON.stringify(gameState, null, 2));
    };

    window.debugSkipToEnd = function() {
      gameState.currentRound = gameState.totalRounds - 1;
      gameState.totalPoints = 24;
      gameState.correctCount = 8;
      console.log('Skipped to last round');
    };

    window.debugSetPoints = function(pts) {
      gameState.totalPoints = pts;
      console.log('Set totalPoints to', pts);
    };

    // === DOMContentLoaded — Main Init ===
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        await waitForPackages();

        // Init FeedbackManager
        if (typeof FeedbackManager !== 'undefined') {
          FeedbackManager.init();

          // Audio preload
          FeedbackManager.sound.preload('correct_sound_effect', 'https://cdn.mathai.ai/mathai-assets/dev/home-explore/document/1757588479110.mp3');
          FeedbackManager.sound.preload('incorrect_sound_effect', 'https://cdn.mathai.ai/mathai-assets/dev/home-explore/document/1757432062452.mp3');
          FeedbackManager.sound.preload('victory_sound_effect', 'https://cdn.mathai.ai/mathai-assets/dev/home-explore/document/1757506672258.mp3');
          FeedbackManager.sound.preload('victory', 'https://cdn.mathai.ai/mathai-assets/dev/worksheet/audio/e252bcc4-bd5f-4195-ad04-a02582095b6d.mp3');
          FeedbackManager.sound.preload('game_complete_sound_effect', 'https://cdn.mathai.ai/mathai-assets/dev/home-explore/document/1757506659491.mp3');
          FeedbackManager.sound.preload('game_complete_1_star', 'https://cdn.mathai.ai/mathai-assets/dev/worksheet/audio/2ee85ea3-919b-4010-95a2-40bcd7d90d22.mp3');
          FeedbackManager.sound.preload('game_complete_2_star', 'https://cdn.mathai.ai/mathai-assets/dev/worksheet/audio/84f4ff34-6e59-43d6-9663-4d9936cad002.mp3');
        }

        // SignalCollector
        if (typeof SignalCollector !== 'undefined') {
          signalCollector = new SignalCollector({
            sessionId: (window.gameVariableState && window.gameVariableState.sessionId) ? window.gameVariableState.sessionId : 'session_' + Date.now(),
            studentId: (window.gameVariableState && window.gameVariableState.studentId) ? window.gameVariableState.studentId : null,
            gameId: gameState.gameId,
            contentSetId: gameState.contentSetId
          });
          window.signalCollector = signalCollector;
        }

        // EventCapture guarded init
        try { if (typeof EventCapture !== 'undefined') EventCapture.init(); } catch(e) {}

        // ScreenLayout injection (v2 sections API)
        var layout = ScreenLayout.inject('app', {
          sections: { header: true, questionText: true, progressBar: true, playArea: true, transitionScreen: true }
        });
        questionSlotId = layout.questionText;

        // Build initial question text
        var qtEl = document.getElementById(questionSlotId);
        if (qtEl) {
          qtEl.innerHTML = '<div style="text-align:center;padding:4px 0;">'
            + '<div style="font-weight:700;font-size:16px;color:var(--mathai-text-primary);">Word Problem Workshop</div>'
            + '<div style="font-size:12px;color:var(--mathai-gray);margin-top:2px;">Turn math expressions into real-world stories!</div>'
            + '</div>';
        }

        // Inject game HTML into gameContent
        var gameContent = document.getElementById('gameContent');
        if (gameContent) {
          gameContent.innerHTML = GAME_HTML;
        }

        // Attach char count listener
        var wordInput = document.getElementById('word-problem-input');
        if (wordInput) {
          wordInput.addEventListener('input', function() {
            var count = wordInput.value.length;
            document.getElementById('char-count').textContent = count;
          });
        }

        // InteractionManager
        if (typeof InteractionManager !== 'undefined') {
          interactionManager = new InteractionManager({
            selector: '.writing-area',
            disableOnAudioFeedback: false,
            disableOnEvaluation: true
          });
        }

        // ProgressBar
        createProgressBar();

        // TransitionScreen
        transitionScreen = new TransitionScreenComponent({ autoInject: true });

        // VisibilityTracker
        visibilityTrackerConfig = {
          onVisible: function() {
            if (signalCollector) {
              signalCollector.recordCustomEvent('visibility_change', { visible: true });
            }
          },
          onHidden: function() {
            if (signalCollector) {
              signalCollector.recordCustomEvent('visibility_change', { visible: false });
            }
            if (gameState.duration_data) {
              gameState.duration_data.inActiveTime.push({ start: new Date().toISOString() });
            }
          }
        };
        if (typeof VisibilityTracker !== 'undefined') {
          visibilityTracker = new VisibilityTracker(visibilityTrackerConfig);
        }

        // Register postMessage handler BEFORE game_ready
        window.addEventListener('message', handlePostMessage);

        // Fire game_ready
        trackEvent('game_ready', 'game');
        window.parent.postMessage({ type: 'game_ready', data: { gameId: gameState.gameId } }, '*');

        // Poll canPlayAudio
        var audioReady = false;
        var audioCheckInterval = setInterval(function() {
          if (canPlayAudio()) {
            audioReady = true;
            clearInterval(audioCheckInterval);
          }
        }, 200);
        setTimeout(function() {
          if (!audioReady) {
            clearInterval(audioCheckInterval);
            audioReady = true;
          }
        }, 15000);

        // Setup game (idempotent, loads fallback content)
        setupGame();

        // Show start transition screen
        transitionScreen.show({
          icons: ['\u270F\uFE0F'],
          iconSize: 'large',
          title: 'Word Problem Workshop',
          subtitle: 'Turn math expressions into real-world stories!',
          persist: true,
          buttons: [{ text: "Let's Go!", type: 'primary',
            action: function() { FeedbackManager._stopCurrentDynamic(); startGame(); } }]
        });

        // Welcome VO (only once, even across restarts)
        if (!gameState.voGameStartPlayed) {
          gameState.voGameStartPlayed = true;
          try {
            gameState.currentDynamicAudio = FeedbackManager.playDynamicFeedback({
              audio_content: 'Welcome to the Word Problem Workshop! See a math expression, then write a real-world story that matches it. Let\'s turn math into stories!',
              subtitle: 'Turn math expressions into real-world stories!',
              sticker: ROUND_STICKER_1
            });
            await gameState.currentDynamicAudio;
            gameState.currentDynamicAudio = null;
          } catch(e) {
            console.error('Welcome VO error:', JSON.stringify({ error: e.message }, null, 2));
            gameState.currentDynamicAudio = null;
          }
        }

      } catch (error) {
        console.error('Game initialization failed:', JSON.stringify({ error: error.message }, null, 2));
        if (typeof Sentry !== 'undefined') {
          Sentry.captureException(error, { tags: { phase: 'initialization', severity: 'critical' } });
        }
      }
    });
  </script>
</body>
</html>
